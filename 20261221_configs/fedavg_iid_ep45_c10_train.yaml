# 20261221 runs -- iid partitioning, RouteNetGroupNorm, K = 10, full participation.
#
# Epoch-aligned with the centralised baseline: instead of fixing T * E and
# letting the budget grow with K, the budget is set so each client sees the
# same number of epochs over its own shard.
#   samples / client = 700  (train_N28.csv 7,077 rows / K, approx.)
#   local steps / round = 25, batch size 8 -> 200 samples / round
#   total local steps / client = 4000  (160 rounds x 25)
#   epochs / client = 4000 * 8 / 700 ~ 45.7
# `strategy.local_epochs` is a step cap, not epochs (see CLAUDE.md).
#
# Paired with fedavg_iid_ep45_c10_test.yaml; run via run_all_experiments.sh.

experiment: fedavg_drc_train_20261221
tag: iid_ep45_c10

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  metadata_csv: ./files/train_N28.csv
  feature_dir: /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/feature
  label_dir:   /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/label

# ---------------------------------------------------------------------------
# Partitioning
# ---------------------------------------------------------------------------
partitioning:
  type: iid
  n_partitions: 10
  seed: 42

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  type: RouteNetGroupNorm
  in_channels: 9
  out_channels: 1

# ---------------------------------------------------------------------------
# Strategy
# ---------------------------------------------------------------------------
strategy:
  type: fedavg
  local_epochs: 25         # E -- step cap, not epochs (see CLAUDE.md)
  learning_rate: 2e-4      # eta
  batch_size: 8            # B
  round_clients: 10        # m = K, full participation
  loss_type: BiasedMSELoss
  biased_loss_s: 5
  biased_loss_b: 0.1
  eval_metric:
    - NRMS
    - SSIM

# ---------------------------------------------------------------------------
# Runtime (shared across all strategies)
# ---------------------------------------------------------------------------
runtime:
  cpu: false
  gpu: 0
  num_workers: 0
  seed: 42
  shuffle: true

# ---------------------------------------------------------------------------
# Training loop
# ---------------------------------------------------------------------------
training:
  num_rounds: 160           # T -- communication rounds
  save_path: ./work_dirs/20261221/fedavg_iid_ep45_c10
  save_freq_rounds: 40     # 0 disables periodic checkpoints

# ---------------------------------------------------------------------------
# Optional held-out evaluation during training
# ---------------------------------------------------------------------------
evaluation:
  metadata_csv: null       # e.g. ./metadata/n28_val.csv
  batch_size: 4
  freq_rounds: 5
  threshold: 0.1
