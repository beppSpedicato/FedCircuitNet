# Client-count sweep -- feature_hierarchical partitioning, RouteNetGroupNorm, K = 100.
#
# Identical to config/fedavg_train_feature_hierarchical_groupnorm.yaml in every field
# except partitioning.n_partitions (K = 100), strategy.round_clients
# (m = ceil(K / 2) = 50, 50 % participation), strategy.local_epochs
# (E = 4, see Strategy), `experiment`, `tag` and training.save_path.
# That config (K = 20, m = 10, E = 20) is the K = 20 point of this sweep
# and is not repeated here.
#
# Paired with fedavg_test_feature_hierarchical_groupnorm_c100.yaml and
# fedavg_augmented_metrics_feature_hierarchical_groupnorm_c100.yaml; run all three via
# run_sweep_clients_exp.sh.
#
# NOTE: design x clock x utilization-rank only yields 36 owned groups on
# train_N28.csv at K = 100, so 64 clients own no group and are filled by
# the Dirichlet spillover alone (FeatureHierarchicalPartitioner warns at
# partition time).  Read this point as "36 silos + 64 spillover clients",
# not as 100 feature-defined teams.

experiment: fedavg_drc_train_sweep_clients
tag: feature_hierarchical_groupnorm_c100

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  metadata_csv: ./files/train_N28.csv
  feature_dir: /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/feature
  label_dir:   /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/label

# ---------------------------------------------------------------------------
# Partitioning
# ---------------------------------------------------------------------------
partitioning:
  type: feature_hierarchical
  n_partitions: 100
  features:
    - design_name
    - clock
    - utilization
  preprocessing:
    - type: rank_utilization
      column: utilization
      keep_in_output: false
      levels:
        low:    [0.70, 0.75]
        medium: [0.80]
        high:   [0.85, 0.90]
  cluster_share: 0.8
  dirichlet_alpha: 0.5
  random_state: 42

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  type: RouteNetGroupNorm
  in_channels: 9
  out_channels: 1

# ---------------------------------------------------------------------------
# Strategy
# ---------------------------------------------------------------------------
strategy:
  type: fedavg
  # Fixed local-step budget T * E * m = 40,000, the same as the K = 20
  # configs (200 * 20 * 10): T and m are held, only E moves, so fewer and
  # larger silos train longer per round.  E = 40000 / (200 * m) = 4.
  # Effective budget here is ~28,600 steps in expectation: 64 of the
  # 100 clients hold < E*B samples and stop after one pass.
  local_epochs: 4          # E -- step cap; a client with < E*B = 32 samples stops after one pass
  learning_rate: 2e-4      # eta
  batch_size: 8            # B
  round_clients: 50        # m = ceil(K / 2)
  loss_type: BiasedMSELoss
  biased_loss_s: 5
  biased_loss_b: 0.1
  eval_metric:
    - NRMS
    - SSIM

# ---------------------------------------------------------------------------
# Runtime (shared across all strategies)
# ---------------------------------------------------------------------------
runtime:
  cpu: false
  gpu: 0
  num_workers: 0
  seed: 42
  shuffle: true

# ---------------------------------------------------------------------------
# Training loop
# ---------------------------------------------------------------------------
training:
  num_rounds: 200          # T -- communication rounds
  save_path: ./work_dirs/sweep_clients/fedavg_feature_hierarchical_groupnorm_c100
  save_freq_rounds: 10     # 0 disables periodic checkpoints

# ---------------------------------------------------------------------------
# Optional held-out evaluation during training
# ---------------------------------------------------------------------------
evaluation:
  metadata_csv: null       # e.g. ./metadata/n28_val.csv
  batch_size: 4
  freq_rounds: 5
  threshold: 0.1
