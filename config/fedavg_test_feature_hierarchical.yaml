# Test companion to fedavg_train_feature_hierarchical.yaml.
#
# Evaluates the checkpoint produced by the feature-hierarchical training
# run on a held-out CircuitNet-N28 DRC set using the same metrics and
# ROC / PR-AUC computation as code_examples/CircuitNet/drc_prediction/test.py.

experiment: fedavg_drc_test_feature_hierarchical

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  metadata_csv: ./files/test_N28.csv
  feature_dir: /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/feature
  label_dir:   /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/label

# ---------------------------------------------------------------------------
# Model + checkpoint
# ---------------------------------------------------------------------------
model:
  type: RouteNet
  in_channels: 9
  out_channels: 1

strategy:
  type: fedavg

checkpoint: ./work_dirs/fedavg_feature_hierarchical/global_model_final.pth

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
runtime:
  cpu: false
  gpu: 0
  num_workers: 0
  seed: 42

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  eval_metric:
    - NRMS
    - SSIM
  threshold: 0.1
  plot_roc: true
  save_path: ./work_dirs/fedavg_feature_hierarchical
