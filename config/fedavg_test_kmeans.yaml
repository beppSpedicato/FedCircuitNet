# Test companion to fedavg_train_kmeans.yaml.
#
# Evaluates the checkpoint produced by the K-means / FedChip training run
# on a held-out CircuitNet-N28 DRC set using the same metrics and
# ROC / PR-AUC computation as code_examples/CircuitNet/drc_prediction/test.py.

experiment: fedavg_drc_test

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  metadata_csv: ./files/test_N28.csv
  feature_dir: /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/feature
  label_dir:   /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/label
  ann_file: ./files/ann_test_N28.csv

# ---------------------------------------------------------------------------
# Model + checkpoint
# ---------------------------------------------------------------------------
model:
  type: RouteNet
  in_channels: 9
  out_channels: 1

strategy:
  type: fedavg

checkpoint: ./work_dirs/fedavg_kmeans/model_round_0500.pth

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
runtime:
  cpu: false
  gpu: 1
  num_workers: 0
  seed: 42

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  eval_metric:
    - NRMS
    - SSIM
  threshold: 0.1
  plot_roc: true
  save_path: ./work_dirs/fedavg_kmeans
