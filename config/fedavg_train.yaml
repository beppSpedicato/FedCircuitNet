# Example configuration for train_aim.py.
#
# Config layout mirrors the code layout:
#   - the `strategy` block's `type` selects an entry in
#     federated.strategies.STRATEGY_REGISTRY (each key maps to
#     federated/strategies/<id>/).  Remaining fields under `strategy` are
#     forwarded to that strategy's factory.
#   - `partitioning.type` selects a class from PARTITIONER_REGISTRY in
#     train_aim.py (currently: iid).
#   - `model.type` selects a class from MODEL_REGISTRY in train_aim.py.

experiment: fedavg_drc_pilot

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  # CSV with at least a `filename` column, one row per CircuitNet-N28 sample.
  metadata_csv: ./metadata/n28_train.csv
  # Each sample is expected at `${feature_dir}/${filename}.npy`
  # and `${label_dir}/${filename}.npy`.
  feature_dir: ./training_set/DRC/feature
  label_dir:   ./training_set/DRC/label

# ---------------------------------------------------------------------------
# Partitioning
# ---------------------------------------------------------------------------
partitioning:
  type: iid
  n_partitions: 5
  seed: 42

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  type: RouteNet
  in_channels: 9
  out_channels: 1

# ---------------------------------------------------------------------------
# Strategy
# ---------------------------------------------------------------------------
# `type` names a subpackage under federated.strategies.<id>.  The rest of
# this block is passed as `strategy_cfg` to that package's build_<id>
# factory.  For FedAvg (McMahan et al. 2017): E, eta, B, loss.
strategy:
  type: fedavg
  local_epochs: 1          # E
  learning_rate: 2e-4      # eta
  batch_size: 8            # B
  loss_type: MSELoss

# ---------------------------------------------------------------------------
# Runtime (shared across all strategies)
# ---------------------------------------------------------------------------
runtime:
  device: cpu              # e.g. "cuda:0"
  num_workers: 0
  seed: 42
  shuffle: true

# ---------------------------------------------------------------------------
# Training loop
# ---------------------------------------------------------------------------
training:
  num_rounds: 100          # T -- communication rounds
  save_path: ./work_dirs/fedavg_pilot
  save_freq_rounds: 10     # 0 disables periodic checkpoints

# ---------------------------------------------------------------------------
# Optional held-out evaluation during training
# ---------------------------------------------------------------------------
# Set metadata_csv to null to disable in-loop validation entirely.
evaluation:
  metadata_csv: null       # e.g. ./metadata/n28_val.csv
  batch_size: 4
  freq_rounds: 5           # only used if metadata_csv is set
  threshold: 0.1           # DRC label binarisation for ROC-AUC / PR-AUC
