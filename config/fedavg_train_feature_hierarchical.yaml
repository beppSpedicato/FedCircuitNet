# Example configuration for train_aim.py.
#
# Config layout mirrors the code layout:
#   - the `strategy` block's `type` selects an entry in
#     federated.strategies.STRATEGY_REGISTRY (each key maps to
#     federated/strategies/<id>/).  Remaining fields under `strategy` are
#     forwarded to that strategy's factory.
#   - `partitioning.type` selects a class from PARTITIONER_REGISTRY in
#     partitioning/__init__.py (iid, kmeans, dirichlet,
#     feature_hierarchical).
#   - `model.type` selects a class from MODEL_REGISTRY in train_aim.py.

experiment: fedavg_drc_feature_hierarchical

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  metadata_csv: ./files/train_N28.csv
  feature_dir: /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/feature
  label_dir:   /home/spedicato/CircuitNet/routability_ir_drop_prediction/training_set_N28/DRC/label

# ---------------------------------------------------------------------------
# Partitioning
# ---------------------------------------------------------------------------
# Top-down hierarchical split driven by an ordered list of metadata
# columns -- no embedding/PCA preprocessing, the raw columns are grouped
# directly.  The first entry produces the top-level cut, the second
# subdivides within each top-level bucket, etc., so `features` order
# encodes design-knob importance.  The K-partition budget is distributed
# across groups proportionally to size; when a level has more distinct
# values than the remaining budget, adjacent values are packed into
# contiguous bins so neighbouring feature values stay on the same client.
# Feature order must supply enough combined cardinality to reach
# `n_partitions` non-empty leaves.
#
# Each client then keeps `cluster_share` (80%) of its own feature group;
# the remaining 20% spills over to all clients through a fresh
# Dirichlet(dirichlet_alpha) draw, exactly as in the kmeans scheme -- so
# the feature boundaries are soft rather than fully disjoint silos.
# Set cluster_share: 1.0 for a hard, deterministic feature split.
#
# Ordering below follows the Phase 2 prediction that design, clock and
# utilization dominate the feature-space separation.  At n_partitions: 6
# the budget is already spent after design_name + clock, so `utilization`
# only becomes active if n_partitions is raised.
partitioning:
  type: feature_hierarchical
  n_partitions: 6
  features:
    - design_name
    - clock
    - utilization
  cluster_share: 0.8
  dirichlet_alpha: 0.5
  random_state: 42

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  type: RouteNet
  in_channels: 9
  out_channels: 1

# ---------------------------------------------------------------------------
# Strategy
# ---------------------------------------------------------------------------
strategy:
  type: fedavg
  local_epochs: 100        # E
  learning_rate: 2e-4      # eta
  batch_size: 8            # B
  loss_type: BiasedMSELoss
  biased_loss_s: 5
  biased_loss_b: 0.1
  eval_metric:
    - NRMS
    - SSIM

# ---------------------------------------------------------------------------
# Runtime (shared across all strategies)
# ---------------------------------------------------------------------------
runtime:
  cpu: false
  gpu: 0
  num_workers: 0
  seed: 42
  shuffle: true

# ---------------------------------------------------------------------------
# Training loop
# ---------------------------------------------------------------------------
training:
  num_rounds: 100          # T -- communication rounds
  save_path: ./work_dirs/fedavg_feature_hierarchical
  save_freq_rounds: 10     # 0 disables periodic checkpoints

# ---------------------------------------------------------------------------
# Optional held-out evaluation during training
# ---------------------------------------------------------------------------
evaluation:
  metadata_csv: null       # e.g. ./metadata/n28_val.csv
  batch_size: 4
  freq_rounds: 5
  threshold: 0.1
